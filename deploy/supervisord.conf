; Process list for the VPS container, started by /start-container.sh.
; Everything logs to the container's stdout so it shows up in Coolify's logs.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; FrankenPHP, exactly as Railpack's default start script launches it.
[program:web]
command=docker-php-entrypoint --config /Caddyfile --adapter caddyfile
directory=/app
autorestart=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Always-on worker for the `database` connection the Shopify jobs are pinned to.
; One process on purpose: webhooks for the same order must keep being handled
; one after another, as they were when the scheduler drained the queue.
; --max-time recycles the process hourly; supervisord starts the next one.
; stopwaitsecs lets a job that is mid-flight finish before a deploy replaces us.
[program:queue]
command=php artisan queue:work database --tries=3 --sleep=1 --max-time=3600
directory=/app
autorestart=true
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Runs the schedule in routes/console.php every minute, in place of cron.
[program:scheduler]
command=php artisan schedule:work
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
