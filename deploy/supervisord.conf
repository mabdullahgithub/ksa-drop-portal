; Process list for the VPS container, started by /start-container.sh.
; Everything logs to the container's stdout so it shows up in Coolify's logs.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; FrankenPHP, exactly as Railpack's default start script launches it.
[program:web]
command=docker-php-entrypoint --config /Caddyfile --adapter caddyfile
directory=/app
autorestart=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Always-on worker for the `database` connection the Shopify jobs are pinned to.
; One process on purpose: webhooks for the same order must keep being handled
; one after another, as they were when the scheduler drained the queue.
; --timeout=0: no per-job limit unless the job sets its own, as before pcntl
; was installed (with it, the default would start killing jobs at 60 seconds).
; --max-time recycles the process hourly; supervisord starts the next one.
; stopwaitsecs lets a job that is mid-flight finish before a deploy replaces us.
[program:queue]
command=php artisan queue:work database --queue=default --tries=3 --sleep=1 --max-time=3600 --timeout=0
directory=/app
autorestart=true
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Live chat's delayed "you have a reply" emails, on their own queue and worker:
; a slow mail server must never hold up the Shopify jobs above.
[program:queue-chat]
command=php artisan queue:work database --queue=chat --tries=2 --sleep=3 --max-time=3600 --timeout=60
directory=/app
autorestart=true
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Runs the schedule in routes/console.php every minute, in place of cron.
[program:scheduler]
command=php artisan schedule:work
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Laravel Reverb: the websocket server behind live chat. Listens on loopback
; only; Caddy forwards the browser's /app/* websocket to it (see Caddyfile), so
; it shares the portal's domain and TLS. Laravel publishes to it over
; REVERB_HOST=127.0.0.1:8080. Without its keys in the env live chat polls
; instead. Limits (publish size, connections, rate) are in config/reverb.php.
; On a deploy, pcntl lets it close each websocket cleanly, and the browsers
; reconnect to the new container and fetch whatever they missed.
[program:reverb]
command=php artisan reverb:start --host=127.0.0.1 --port=8080
directory=/app
priority=100
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
